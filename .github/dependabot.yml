version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    groups:
      cargo:
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/web"
    schedule: { interval: "weekly" }
    open-pull-requests-limit: 5
    groups:
      npm:
        update-types: ["minor", "patch"]
